<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 100" width="128" height="100" role="img" aria-label="Capacitor Foldable">
  <title>Capacitor Foldable</title>
  <defs>
    <linearGradient id="cf-ti" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e7e2"/>
      <stop offset=".5" stop-color="#b3b0aa"/>
      <stop offset="1" stop-color="#8a8780"/>
    </linearGradient>
    <linearGradient id="cf-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset=".55" stop-color="#ff5f7a"/>
      <stop offset="1" stop-color="#9b3dff"/>
    </linearGradient>
    <linearGradient id="cf-crease" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- titanium side button (Touch ID) -->
  <rect x="120.5" y="30" width="4.5" height="20" rx="2.25" fill="url(#cf-ti)"/>
  <!-- titanium frame and slim black bezel -->
  <rect x="3.5" y="6.5" width="118" height="87" rx="22" fill="#0b0b0c" stroke="url(#cf-ti)" stroke-width="4"/>
  <!-- one continuous inner display -->
  <rect x="10" y="13" width="105" height="74" rx="16" fill="url(#cf-screen)"/>
  <!-- faint crease -->
  <rect x="55" y="13" width="14" height="74" fill="url(#cf-crease)"/>
  <rect x="61.5" y="13" width="1" height="74" fill="#fff" fill-opacity=".22"/>
  <!-- circular status element in the corner -->
  <rect x="95.5" y="20" width="11" height="3.5" rx="1.75" fill="#fff"/>
  <circle cx="101" cy="35" r="8.5" fill="#0b0b0c" fill-opacity=".6"/>
  <path d="M96.5 34 a6.5 6.5 0 0 1 9 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="101" cy="38.5" r="1.4" fill="#fff"/>
  <!-- titanium hinge cover -->
  <rect x="54" y="1.5" width="16" height="10" rx="3.5" fill="url(#cf-ti)"/>
  <rect x="54" y="88.5" width="16" height="10" rx="3.5" fill="url(#cf-ti)"/>
</svg>
