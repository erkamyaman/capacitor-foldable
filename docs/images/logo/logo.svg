<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 92" width="120" height="92" role="img" aria-label="Capacitor Foldable">
  <title>Capacitor Foldable</title>
  <defs>
    <!-- Grade 5 titanium: one light source (top-left) for frame, hinge cover and side buttons -->
    <linearGradient id="cf-duo-ti" gradientUnits="userSpaceOnUse" x1="2.6" y1="3.9" x2="114.6" y2="87.9">
      <stop offset="0" stop-color="#e6e2da"/>
      <stop offset=".3" stop-color="#c5c1b9"/>
      <stop offset=".62" stop-color="#a09c94"/>
      <stop offset=".86" stop-color="#85827b"/>
      <stop offset="1" stop-color="#aaa69e"/>
    </linearGradient>
    <linearGradient id="cf-duo-edge" gradientUnits="userSpaceOnUse" x1="2.6" y1="3.9" x2="114.6" y2="87.9">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="cf-duo-screen" gradientUnits="userSpaceOnUse" x1="9.4" y1="10.7" x2="107.8" y2="81.1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset=".42" stop-color="#ff6a78"/>
      <stop offset=".58" stop-color="#f6568a"/>
      <stop offset="1" stop-color="#a23cf6"/>
    </linearGradient>
    <linearGradient id="cf-duo-glass" gradientUnits="userSpaceOnUse" x1="9.4" y1="10.7" x2="58.6" y2="81.1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cf-duo-crease" gradientUnits="userSpaceOnUse" x1="52.1" y1="0" x2="65.1" y2="0">
      <stop offset="0" stop-color="#2a0a3a" stop-opacity="0"/>
      <stop offset=".38" stop-color="#2a0a3a" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#2a0a3a" stop-opacity=".3"/>
      <stop offset=".62" stop-color="#2a0a3a" stop-opacity=".1"/>
      <stop offset="1" stop-color="#2a0a3a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- titanium side button (Touch ID) -->
  <path d="M114 27H116Q117.3 27 117.3 28.3V50.5Q117.3 51.8 116 51.8H114Z" fill="url(#cf-duo-ti)" stroke="#2b2925" stroke-opacity=".55" stroke-width=".55"/>

  <!-- grade 5 titanium frame -->
  <path d="M20.6 3.9H96.6C111 3.9 114.6 7.5 114.6 21.9V69.9C114.6 84.3 111 87.9 96.6 87.9H20.6C6.2 87.9 2.6 84.3 2.6 69.9V21.9C2.6 7.5 6.2 3.9 20.6 3.9Z" fill="url(#cf-duo-ti)"/>
  <path d="M20.48 4.3H96.72C110.7 4.3 114.2 7.8 114.2 21.78V70.02C114.2 84 110.7 87.5 96.72 87.5H20.48C6.5 87.5 3 84 3 70.02V21.78C3 7.8 6.5 4.3 20.48 4.3Z" fill="none" stroke="url(#cf-duo-edge)" stroke-width=".7"/>
  <path d="M20.6 3.9H96.6C111 3.9 114.6 7.5 114.6 21.9V69.9C114.6 84.3 111 87.9 96.6 87.9H20.6C6.2 87.9 2.6 84.3 2.6 69.9V21.9C2.6 7.5 6.2 3.9 20.6 3.9Z" fill="none" stroke="#2b2925" stroke-opacity=".7" stroke-width=".75"/>
  <!-- titanium hinge cover: two short caps, same metal as the frame -->
  <path d="M52.4 5.2V3.6Q52.4 1.4 54.6 1.4H62.6Q64.8 1.4 64.8 3.6V5.2Z" fill="url(#cf-duo-ti)" stroke="#2b2925" stroke-opacity=".7" stroke-width=".7"/>
  <path d="M52.4 86.6V88.2Q52.4 90.4 54.6 90.4H62.6Q64.8 90.4 64.8 88.2V86.6Z" fill="url(#cf-duo-ti)" stroke="#2b2925" stroke-opacity=".7" stroke-width=".7"/>
  <path d="M53.2 2.8Q53.8 2.2 54.8 2.2H62.4" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".6" stroke-linecap="round"/>

  <!-- slim black bezel -->
  <path d="M19.49 7.6H97.71C108.26 7.6 110.9 10.24 110.9 20.79V71.01C110.9 81.56 108.26 84.2 97.71 84.2H19.49C8.94 84.2 6.3 81.56 6.3 71.01V20.79C6.3 10.24 8.94 7.6 19.49 7.6Z" fill="#0a0a0b"/>

  <!-- one continuous inner display -->
  <path d="M18.56 10.7H98.64C105.97 10.7 107.8 12.53 107.8 19.86V71.94C107.8 79.27 105.97 81.1 98.64 81.1H18.56C11.23 81.1 9.4 79.27 9.4 71.94V19.86C9.4 12.53 11.23 10.7 18.56 10.7Z" fill="url(#cf-duo-screen)"/>
  <path d="M18.56 10.7H98.64C105.97 10.7 107.8 12.53 107.8 19.86V71.94C107.8 79.27 105.97 81.1 98.64 81.1H18.56C11.23 81.1 9.4 79.27 9.4 71.94V19.86C9.4 12.53 11.23 10.7 18.56 10.7Z" fill="url(#cf-duo-glass)"/>

  <!-- the crease: quiet, but a valley plus a hairline highlight so it holds at small sizes -->
  <rect x="52.1" y="10.7" width="13" height="70.4" fill="url(#cf-duo-crease)"/>
  <rect x="58.85" y="10.7" width=".55" height="70.4" fill="#fff" fill-opacity=".18"/>

  <!-- status system, fitted into the corner: clock pill, then a ring open at the bottom -->
  <rect x="93.2" y="15.6" width="8.6" height="2.6" rx="1.3" fill="#fff"/>
  <path d="M92.9 33.1A5.6 5.6 0 1 1 102.1 33.1" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2"/>
  <path d="M94.5 28.6A3.9 3.9 0 0 1 100.5 28.6M95.7 30.1A2.2 2.2 0 0 1 99.3 30.1" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="1.3"/>
  <circle cx="97.5" cy="31.7" r="1" fill="#fff"/>
</svg>
